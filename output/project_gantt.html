        /* variables.css */
/* CSS Variables - Theme Colors */
:root {
    --bg-primary: #ffffff;
    --bg-secondary: #f8fafc;
    --bg-tertiary: #f1f5f9;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --border-color: #e2e8f0;
    --shadow-color: rgba(0, 0, 0, 0.1);
    --card-bg: #ffffff;
    --btn-bg: #6d4aff;
    --btn-hover: #5a42df;
    --btn-text: #ffffff;
}

[data-theme="dark"] {
    --bg-primary: #0f172a;
    --bg-secondary: #1e293b;
    --bg-tertiary: #334155;
    --text-primary: #f1f5f9;
    --text-secondary: #cbd5e1;
    --text-muted: #94a3b8;
    --border-color: #475569;
    --shadow-color: rgba(0, 0, 0, 0.3);
    --card-bg: #1e293b;
    --btn-bg: #6d4aff;
    --btn-hover: #8b7dff;
    --btn-text: #ffffff;
}

/* Reset & Base */
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-secondary);
    color: var(--text-primary);
    line-height: 1.6;
    transition: background-color 0.3s ease, color 0.3s ease;
}

/* layout.css */
/* Layout Components */
.header {
    background: linear-gradient(135deg, #6d4aff 0%, #4a3ab8 100%);
    color: white;
    padding: 2rem;
    text-align: center;
    margin-bottom: 2rem;
    box-shadow: 0 2px 8px var(--shadow-color);
}

.header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
.header-meta { opacity: 0.9; font-size: 0.9rem; }

.controls {
    max-width: 1400px;
    margin: 0 auto 2rem;
    padding: 0 1rem;
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    align-items: center;
}

.control-group {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
    align-items: center;
}

.control-label {
    font-size: 0.85rem;
    color: var(--text-secondary);
    font-weight: 500;
    margin-right: 0.5rem;
}

.card {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
    box-shadow: 0 1px 3px var(--shadow-color);
    padding: 1rem;
    transition: all 0.3s ease;
}

.legend {
    max-width: 1400px;
    margin: 0 auto 2rem;
    padding: 1rem;
}

.legend-title { font-weight: 600; margin-bottom: 0.5rem; }
.legend-items { display: flex; flex-wrap: wrap; gap: 1rem; }

.chart-wrapper {
    max-width: 1400px;
    margin: 0 auto 4rem;
    padding: 0 1rem;
}

.footer {
    text-align: center;
    padding: 2rem;
    color: var(--text-secondary);
    font-size: 0.85rem;
}

/* Responsive */
@media (max-width: 768px) {
    .header h1 { font-size: 1.5rem; }
    .controls { justify-content: center; }
}

/* Print Styles */
@media print {
    .theme-toggle, .controls, .legend { display: none !important; }
    .header { background: #6d4aff !important; -webkit-print-color-adjust: exact; }
    body { background: white !important; color: black !important; }
    .card { box-shadow: none; border: 1px solid #ccc; }
}

/* components.css */
/* Button Components */
.btn {
    background: var(--btn-bg);
    color: var(--btn-text);
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.85rem;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
}

.btn:hover {
    background: var(--btn-hover);
    transform: translateY(-1px);
}

.btn:active { transform: translateY(0); }

.btn.secondary {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    color: var(--text-primary);
}

.btn.secondary:hover {
    background: var(--bg-tertiary);
    border-color: var(--btn-bg);
}

.btn.active {
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.2);
    opacity: 0.8;
}

/* Status Filter */
.status-filter {
    display: flex;
    gap: 0.4rem;
    flex-wrap: wrap;
    padding: 0.5rem;
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 8px;
}

.status-btn {
    background: var(--bg-tertiary);
    border: 1px solid transparent;
    padding: 0.5rem 1rem;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s ease;
    color: var(--text-secondary);
}

.status-btn:hover {
    border-color: var(--btn-bg);
    color: var(--text-primary);
}

.status-btn.completed { border-left: 3px solid #4CAF50; }
.status-btn.in_progress { border-left: 3px solid #2196F3; }
.status-btn.pending { border-left: 3px solid #FF9800; }

.status-btn.active {
    background: var(--btn-bg);
    color: white;
    border-color: var(--btn-bg);
}

/* Badges & Indicators */
.legend-badge {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1rem;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 500;
}

.legend-dot { width: 12px; height: 12px; border-radius: 50%; }

.status-badge {
    display: inline-block;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    font-size: 0.75rem;
    font-weight: 500;
}

.status-badge.completed { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
.status-badge.in_progress { background: rgba(33, 150, 243, 0.2); color: #2196F3; }
.status-badge.pending { background: rgba(255, 152, 0, 0.2); color: #FF9800; }

.task-hidden { display: none !important; }

.filter-info {
    text-align: center;
    padding: 1rem;
    color: var(--text-secondary);
    font-style: italic;
}

/* Gantt Specific */
#gantt {
    width: 100%;
    height: 700px;
    border: 1px solid var(--border-color);
    border-radius: 8px;
    overflow: hidden;
}

    <script>
        // theme.js
// Theme Management Module - No Framework Dependencies
var THEME_KEY = 'gantt-chart-theme';
var themeToggle = null;
var themeIcon = null;

function initThemeModule() {
    themeToggle = document.getElementById('themeToggle');
    themeIcon = document.getElementById('themeIcon');

    if (!themeToggle) return;

    initTheme();
    themeToggle.addEventListener('click', toggleTheme);

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem(THEME_KEY)) {
            setTheme(e.matches ? 'dark' : 'light');
        }
    });
}

function initTheme() {
    var savedTheme = localStorage.getItem(THEME_KEY);
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme) {
        setTheme(savedTheme);
    } else if (prefersDark) {
        setTheme('dark');
    }
}

function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(THEME_KEY, theme);

    if (themeIcon) {
        themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
}

function toggleTheme() {
    var currentTheme = document.documentElement.getAttribute('data-theme');
    var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    setTheme(newTheme);
}

window.ThemeManager = {
    init: initThemeModule,
    setTheme: setTheme,
    toggle: toggleTheme
};

// filters.js
// Status Filter Module - No Framework Dependencies
var activeFilters = new Set(['completed', 'in_progress', 'pending']);
var originalTaskCount = 0;

function initFilterModule(chart) {
    updateFilterInfo();
}

function shouldShowTask(task) {
    if (!task) return true;
    if (task.is_epic) return true;
    if (!task.status) return true;
    return activeFilters.has(task.status);
}

function filterByStatus(buttonElement) {
    var status = buttonElement.dataset.status;

    buttonElement.classList.toggle('active');

    if (buttonElement.classList.contains('active')) {
        activeFilters.add(status);
    } else {
        activeFilters.delete(status);
    }

    // Re-render if chart available
    if (typeof window.renderGanttView === 'function') {
        window.renderGanttView();
    }

    updateFilterInfo();
}

function resetFilters() {
    activeFilters.clear();
    activeFilters.add('completed');
    activeFilters.add('in_progress');
    activeFilters.add('pending');

    document.querySelectorAll('.status-btn').forEach(function(btn) {
        btn.classList.add('active');
    });

    if (typeof window.renderGanttView === 'function') {
        window.renderGanttView();
    }

    updateFilterInfo();
}

function updateFilterInfo() {
    var infoEl = document.getElementById('filterInfo');
    if (!infoEl) return;

    var allTasks = window.projectData || [];
    var visibleCount = allTasks.filter(function(t) {
        return t && !t.is_epic && shouldShowTask(t);
    }).length;

    var totalCount = allTasks.filter(function(t) {
        return t && !t.is_epic;
    }).length;

    originalTaskCount = totalCount;

    if (visibleCount !== totalCount) {
        infoEl.style.display = 'block';
        var filteredCount = totalCount - visibleCount;
        infoEl.textContent = visibleCount + '/' + totalCount + ' tasks shown (' + filteredCount + ' filtered)';
    } else {
        infoEl.style.display = 'none';
    }
}

window.FilterManager = {
    init: initFilterModule,
    filterByStatus: filterByStatus,
    reset: resetFilters
};

window.filterByStatus = filterByStatus;
window.resetFilters = resetFilters;

<script>
// theme.js
// Theme Management Module - No Framework Dependencies
var THEME_KEY = 'gantt-chart-theme';
var themeToggle = null;
var themeIcon = null;

function initThemeModule() {
    themeToggle = document.getElementById('themeToggle');
    themeIcon = document.getElementById('themeIcon');

    if (!themeToggle) return;

    initTheme();
    themeToggle.addEventListener('click', toggleTheme);

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function(e) {
        if (!localStorage.getItem(THEME_KEY)) {
            setTheme(e.matches ? 'dark' : 'light');
        }
    });
}

function initTheme() {
    var savedTheme = localStorage.getItem(THEME_KEY);
    var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

    if (savedTheme) {
        setTheme(savedTheme);
    } else if (prefersDark) {
        setTheme('dark');
    }
}

function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem(THEME_KEY, theme);

    if (themeIcon) {
        themeIcon.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
}

function toggleTheme() {
    var currentTheme = document.documentElement.getAttribute('data-theme');
    var newTheme = currentTheme === 'dark' ? 'light' : 'dark';
    setTheme(newTheme);
}

window.ThemeManager = {
    init: initThemeModule,
    setTheme: setTheme,
    toggle: toggleTheme
};

// filters.js
// Status Filter Module - No Framework Dependencies
var activeFilters = new Set(['completed', 'in_progress', 'pending']);
var originalTaskCount = 0;

function initFilterModule(chart) {
    updateFilterInfo();
}

function shouldShowTask(task) {
    if (!task) return true;
    if (task.is_epic) return true;
    if (!task.status) return true;
    return activeFilters.has(task.status);
}

function filterByStatus(buttonElement) {
    var status = buttonElement.dataset.status;

    buttonElement.classList.toggle('active');

    if (buttonElement.classList.contains('active')) {
        activeFilters.add(status);
    } else {
        activeFilters.delete(status);
    }

    // Re-render if chart available
    if (typeof window.renderGanttView === 'function') {
        window.renderGanttView();
    }

    updateFilterInfo();
}

function resetFilters() {
    activeFilters.clear();
    activeFilters.add('completed');
    activeFilters.add('in_progress');
    activeFilters.add('pending');

    document.querySelectorAll('.status-btn').forEach(function(btn) {
        btn.classList.add('active');
    });

    if (typeof window.renderGanttView === 'function') {
        window.renderGanttView();
    }

    updateFilterInfo();
}

function updateFilterInfo() {
    var infoEl = document.getElementById('filterInfo');
    if (!infoEl) return;

    var allTasks = window.projectData || [];
    var visibleCount = allTasks.filter(function(t) {
        return t && !t.is_epic && shouldShowTask(t);
    }).length;

    var totalCount = allTasks.filter(function(t) {
        return t && !t.is_epic;
    }).length;

    originalTaskCount = totalCount;

    if (visibleCount !== totalCount) {
        infoEl.style.display = 'block';
        var filteredCount = totalCount - visibleCount;
        infoEl.textContent = visibleCount + '/' + totalCount + ' tasks shown (' + filteredCount + ' filtered)';
    } else {
        infoEl.style.display = 'none';
    }
}

window.FilterManager = {
    init: initFilterModule,
    filterByStatus: filterByStatus,
    reset: resetFilters
};

window.filterByStatus = filterByStatus;
window.resetFilters = resetFilters;

</script>


<!-- GANTT INITIALIZATION -->
<script>
(function() {
    console.log('=== INITIALIZATION PHASE ===');

    function initGantt() {
        // Double-check after delayed execution
        console.log('Checking Gantt availability again...');
        console.log('Gantt:', typeof Gantt);

        if (typeof Gantt !== 'function') {
            console.error('Gantt still not available after checks!');
            console.log('Trying one more CDN attempt...');

            var script = document.createElement('script');
            script.src = 'https://cdn.jsdelivr.net/npm/frappe-gantt@0.6.1/dist/frappe-gantt.min.js';
            script.onload = function() {
                console.log('CDN load triggered init');
                initGantt();
            };
            document.body.appendChild(script);
            return;
        }

        if (typeof projectData === 'undefined' || projectData.length === 0) {
            console.error('projectData not found!');
            return;
        }

        try {
            console.log('Converting', projectData.length, 'tasks to Gantt format...');

            var frappeTasks = projectData.map(function(task) {
                return {
                    id: task.id,
                    name: task.text,
                    start: task.start_date,
                    end: task.end_date,
                    progress: Math.round((task.progress || 0) * 100),
                    dependencies: '',
                    custom_class: task.is_epic ? 'epic-task' : 'feature-task'
                };
            });

            console.log('Creating Gantt instance...');
            window.ganttChart = new Gantt('#gantt', frappeTasks, {
                view_mode: 'Day',
                on_click: function(task) {
                    console.log('Task clicked:', task);
                }
            });

            console.log('✓ SUCCESS: Gantt initialized!');
            console.log('ganttChart:', window.ganttChart);

            // Keep the full converted task list around so filtering/collapsing
            // can rebuild subsets of it and hand them to chart.refresh()
            window.allFrappeTasks = frappeTasks;
            window.collapsedEpics = window.collapsedEpics || new Set();

            // Single shared re-render: recomputes which tasks should be visible
            // based on active status filters + collapsed epics, then refreshes
            // the chart with that subset. filters.js and expandAll/collapseAll
            // both call this instead of touching the chart directly.
            window.renderGanttView = function() {
                if (!window.ganttChart || !window.allFrappeTasks) return;

                var visibleIds = {};
                projectData.forEach(function(task) {
                    if (!task) return;
                    if (task.is_epic) {
                        visibleIds[task.id] = true;
                    } else {
                        var parentCollapsed = window.collapsedEpics.has(task.parent);
                        var passesFilter = typeof shouldShowTask === 'function' ? shouldShowTask(task) : true;
                        if (!parentCollapsed && passesFilter) {
                            visibleIds[task.id] = true;
                        }
                    }
                });

                var visibleTasks = window.allFrappeTasks.filter(function(t) {
                    return visibleIds[t.id];
                });

                if (visibleTasks.length === 0) {
                    console.warn('renderGanttView: no tasks visible, skipping refresh to avoid an empty chart');
                    return;
                }

                window.ganttChart.refresh(visibleTasks);
            };

            // Build legend
            if (typeof buildLegend === 'function') {
                buildLegend(projectData);
            }

            // Initialize managers
            if (typeof ThemeManager !== 'undefined') {
                ThemeManager.init();
            }
            if (typeof FilterManager !== 'undefined') {
                FilterManager.init(window.ganttChart);
            }

        } catch (error) {
            console.error('Initialization error:', error);
            console.error(error.stack);
            alert('Error: ' + error.message);
        }
    }

    // Wait for DOM
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initGantt);
    } else {
        // DOM already ready
        setTimeout(initGantt, 100);
    }
})();

// GLOBAL FUNCTIONS
window.collapsedEpics = window.collapsedEpics || new Set();

window.expandAll = function() {
    window.collapsedEpics.clear();
    if (typeof window.renderGanttView === 'function') window.renderGanttView();
    if (typeof updateFilterInfo === 'function') updateFilterInfo();
};
window.collapseAll = function() {
    var epicIds = (window.projectData || []).filter(function(t) { return t && t.is_epic; }).map(function(t) { return t.id; });
    window.collapsedEpics = new Set(epicIds);
    if (typeof window.renderGanttView === 'function') window.renderGanttView();
    if (typeof updateFilterInfo === 'function') updateFilterInfo();
};
window.zoomIn = function() {
    if (window.ganttChart && window.ganttChart.change_view_mode) {
        var views = ['Quarter', 'Month', 'Week', 'Day'];
        var idx = views.indexOf(window.ganttChart.options.view_mode);
        if (idx > 0) window.ganttChart.change_view_mode(views[idx - 1]);
    }
};
window.zoomOut = function() {
    if (window.ganttChart && window.ganttChart.change_view_mode) {
        var views = ['Quarter', 'Month', 'Week', 'Day'];
        var idx = views.indexOf(window.ganttChart.options.view_mode);
        if (idx < views.length - 1) window.ganttChart.change_view_mode(views[idx + 1]);
    }
};
// NOTE: filterByStatus/resetFilters are defined for real in filters.js
// (bundled above) and already assigned to window there. Do not reassign
// them here to stub console.log versions - that was the bug that made
// the filter buttons appear to do nothing.

// LEGEND BUILDER
function buildLegend(tasks) {
    var container = document.getElementById('legendContainer');
    if (!container) return;
    container.innerHTML = '';

    tasks.filter(function(task) { return task && task.is_epic; }).forEach(function(epic) {
        var badge = document.createElement('span');
        badge.className = 'legend-badge';
        badge.style.background = epic.color + '20';
        var dot = document.createElement('span');
        dot.className = 'legend-dot';
        dot.style.background = epic.color;
        badge.appendChild(dot);
        badge.appendChild(document.createTextNode(epic.text.replace(/^▶\s*/, '')));
        container.appendChild(badge);
    });
}
</script>
